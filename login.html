<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="evoting.css" />
    <link rel="stylesheet" href="evoting.js" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      .login-box {
        background: hsl(0, 0%, 100%, 0.5);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        margin: auto;
        margin-top: 10%;
      }

      .login-box h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        color: gray;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #0056b3;
      }

      #error {
        color: red;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="topBar"></div>
    <div class="side-maincontent">
      <div class="" id="leftBar"></div>
      <div class="main-page">
        <div class="" id="desktopNav"></div>

        <div class="login-box">
          <h2>Login</h2>

          <div class="input-group">
            <input type="text" id="username" placeholder="Username" />
          </div>

          <div class="input-group">
            <input type="password" id="password" placeholder="Password" />
          </div>

          <button onclick="login()">Login</button>

          <p id="error"></p>
        </div>
      </div>
    </div>

    <script>
      function login() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        // Demo credentials
        if (username === "admin" && password === "1234") {
          window.location.href = "vaultadmin.html";
        } else {
          document.getElementById("error").textContent =
            "Invalid username or password";
        }
      }
    </script>
    <div id="navBottom"></div>

    <!--Javascricpt-->
    <script type="module" src="evoting.js"></script>
    <script type="module" src="eform.js"></script>
  </body>
</html>
