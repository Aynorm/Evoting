<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="evoting.css" />

    <title>Voting</title>
    <style>
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
      }

      .image-box {
        position: relative;
        width: 160px;
        background: transparent;
        border: 1px solid gray;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .image-box img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <script>
      //For theme changer
      function myTheme() {
        var element = document.body;
        element.classList.toggle("light-mode");
      }
    </script>

    <div id="topBar"></div>
    <div id="leftBar"></div>
    <div class="side-maincontent">
      <div class="" id="leftBar"></div>
      <div class="admin-all-container main-page">
        <div class="" id="desktopNav"></div>
        <h1>Miss Nigeria</h1>

        <div class="gallery" id="gallery"></div>

        <script>
          const gallery = document.getElementById("gallery");

          // 📦 Get images
          function getImages() {
            return JSON.parse(localStorage.getItem("gallery")) || [];
          }

          // 📦 Get votes
          function getVotes() {
            return JSON.parse(localStorage.getItem("votes")) || {};
          }

          // 💾 Save votes
          function saveVotes(votes) {
            localStorage.setItem("votes", JSON.stringify(votes));
          }

          // 🖼️ Display images + voting
          function displayImages() {
            gallery.innerHTML = "";

            const images = getImages();
            const votes = getVotes();

            images.forEach((item, index) => {
              const box = document.createElement("div");
              box.classList.add("image-box");

              const img = document.createElement("img");
              img.src = item.src;

              const caption = document.createElement("div");
              caption.textContent = item.caption;

              const voteCount = document.createElement("p");
              voteCount.textContent = "Votes: " + (votes[index] || 0);

              const voteBtn = document.createElement("button");
              voteBtn.textContent = "Vote";

              voteBtn.onclick = function () {
                let votes = getVotes();

                votes[index] = (votes[index] || 0) + 1;
                saveVotes(votes);

                // save selected image for payment
                localStorage.setItem("selectedImage", index);

                // go to payment page
                window.location.href = "payment.html";
              };

              box.appendChild(img);
              box.appendChild(caption);
              box.appendChild(voteCount);
              box.appendChild(voteBtn);

              gallery.appendChild(box);
            });
          }

          // auto refresh
          setInterval(displayImages, 1000);
          displayImages();
        </script>
      </div>
    </div>

    <div id="navBottom"></div>

    <script type="module" src="eform.js"></script>
  </body>
</html>
