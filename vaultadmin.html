<!doctype html>
<html>
  <head>
    <title>Vault Admin Panel</title>
    <link rel="stylesheet" href="vault.css" />
    <link rel="stylesheet" href="evoting.css" />
    <link rel="stylesheet" href="evoting.js" />
  </head>

  <body>
    <!-- <button onclick="myTheme()">switch</button> -->
    <script>
      function myTheme() {
        var element = document.body;
        element.classList.toggle("light-mode");
      }
    </script>
    <div id="topBar"></div>
    <div class="side-maincontent">
      <div class="" id="leftBar"></div>
      <div class="main-page">
        <div class="" id="desktopNav"></div>
        <h2>Vault Admin Control</h2>

        <input type="file" id="imageInput" accept="image/*" multiple />
        <div id="gallery" class="gallery"></div>
      </div>
    </div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const gallery = document.getElementById("gallery");

      // 📦 Get
      function getImages() {
        return JSON.parse(localStorage.getItem("gallery")) || [];
      }

      // 💾 Save
      function saveImages(images) {
        localStorage.setItem("gallery", JSON.stringify(images));
        displayImages();
      }

      // 🖼️ Display (Admin version with controls)
      function displayImages() {
        gallery.innerHTML = "";
        let images = getImages();

        images.forEach((item, index) => {
          const box = document.createElement("div");
          box.classList.add("image-box");

          const img = document.createElement("img");
          img.src = item.src;
          img.style.width = "120px";

          const input = document.createElement("input");
          input.value = item.caption;
          input.style.width = "80%";

          const saveBtn = document.createElement("button");
          saveBtn.textContent = "Update";

          saveBtn.onclick = function () {
            images[index].caption = input.value;
            saveImages(images);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";

          deleteBtn.onclick = function () {
            images.splice(index, 1);
            saveImages(images);
          };

          box.appendChild(img);
          box.appendChild(input);
          box.appendChild(saveBtn);
          box.appendChild(deleteBtn);

          gallery.appendChild(box);
        });
      }

      // 📤 Upload
      imageInput.addEventListener("change", function () {
        let images = getImages();

        for (let file of imageInput.files) {
          const reader = new FileReader();

          reader.onload = function (e) {
            images.push({
              src: e.target.result,
              caption: "No caption",
            });

            saveImages(images);
          };

          reader.readAsDataURL(file);
        }
      });

      // Load admin view
      displayImages();
    </script>
    <div id="navBottom"></div>

    <!--Javascricpt-->
    <script type="module" src="evoting.js"></script>
    <script type="module" src="eform.js"></script>
  </body>
</html>
