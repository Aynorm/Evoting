<!doctype html>
<html>
  <head>
    <title>Vault Admin Panel</title>
    <link rel="stylesheet" href="vault.cs" />
  </head>
  <body>
    <h2>Vault Admin Control</h2>

    <input type="file" id="imageInput" accept="image/*" multiple />
    <div id="gallery"></div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const gallery = document.getElementById("gallery");

      // 📦 Get
      function getImages() {
        return JSON.parse(localStorage.getItem("gallery")) || [];
      }

      // 💾 Save
      function saveImages(images) {
        localStorage.setItem("gallery", JSON.stringify(images));
        displayImages();
      }

      // 🖼️ Display (Admin version with controls)
      function displayImages() {
        gallery.innerHTML = "";
        let images = getImages();

        images.forEach((item, index) => {
          const box = document.createElement("div");

          const img = document.createElement("img");
          img.src = item.src;
          img.style.width = "120px";

          const input = document.createElement("input");
          input.value = item.caption;

          const saveBtn = document.createElement("button");
          saveBtn.textContent = "Update";

          saveBtn.onclick = function () {
            images[index].caption = input.value;
            saveImages(images);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";

          deleteBtn.onclick = function () {
            images.splice(index, 1);
            saveImages(images);
          };

          box.appendChild(img);
          box.appendChild(input);
          box.appendChild(saveBtn);
          box.appendChild(deleteBtn);

          gallery.appendChild(box);
        });
      }

      // 📤 Upload
      imageInput.addEventListener("change", function () {
        let images = getImages();

        for (let file of imageInput.files) {
          const reader = new FileReader();

          reader.onload = function (e) {
            images.push({
              src: e.target.result,
              caption: "No caption",
            });

            saveImages(images);
          };

          reader.readAsDataURL(file);
        }
      });

      // Load admin view
      displayImages();
    </script>
  </body>
</html>
